services:
  # Next.js Application
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: