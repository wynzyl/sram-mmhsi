# Development Docker Compose for SRAMS
# Runs PostgreSQL + Next.js (dev mode w/ hot reload) together.
# Usage:
#   docker compose up --build
#   docker compose watch                # sync file changes + auto-rebuild on dep changes
#   docker compose run --rm seed        # optional: seed system config
#   docker compose run --rm seed-data   # optional: seed sample data
#   docker compose exec app              # get a shell inside the running app container
#   docker compose -f docker-compose.prod.yml up -d --build   # prod stack (separate project)
#
# `name:` pins the dev project to srams-dev. The directory-default name
# (sram-mmhsi) is reserved for the prod stack so it matches the Ubuntu server's
# project/volume names. Never pass -p — it overrides this pin.

name: srams-dev

#networks:
  #proxy-network:
    #external: true
    #driver: bridge

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      # Expose on 5434 to avoid clashing with a local Postgres on 5432
      - "5434:5432"
    volumes:
      # Host bind mount — dev DB data lives in ./.postgres_data (gitignored).
      - ./.postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply Drizzle migrations before the app starts
  migrate:
    image: sram-mmhsi-app:dev
    env_file:
      - .env.local
    environment:
      # Override .env.local's host-side localhost URL: inside the compose network
      # the database is the `db` service on its internal port 5432.
      DATABASE_URL: postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "tsx", "scripts/migrate.ts"]
    restart: "no"

  app:
    image: sram-mmhsi-app:dev
    build:
      context: .
      target: dev
    ports:
      - "3003:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      # Override .env.local's host-side localhost URL: reach the `db` service.
      DATABASE_URL: postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Keep container-managed node_modules so it isn't shadowed by the host.
      # NOTE: .next is intentionally NOT a named volume — persisting it across
      # rebuilds caused the webpack PackFileCacheStrategy to serve deleted
      # modules from a stale cache. Leaving it in the container's writable
      # layer keeps the build cache fresh on every recreate.
      - app-node-modules:/app/node_modules
    develop:
      watch:
        # Sync application source into the running container
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./drizzle
          target: /app/drizzle
        - action: sync
          path: ./scripts
          target: /app/scripts
        # Top-level config files: sync and restart Next.js to pick up changes
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./drizzle.config.ts
          target: /app/drizzle.config.ts
        # Dependency changes require a full image rebuild
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
      #networks:
        #- proxy-network

  # Optional helpers — run with: docker compose run --rm seed
  seed:
    image: sram-mmhsi-app:dev
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed-config"]
    profiles: ["tools"]

  seed-data:
    image: sram-mmhsi-app:dev
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]
    profiles: ["tools"]

volumes:
  app-node-modules:
  db-data:
  uploads_data:
    driver: local

