services:
  # PostgreSQL database (use profile to optionally run containerized DB)
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    profiles:
      - with-db
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SRAMS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Next.js Application (development) - connects to host PostgreSQL
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Connect to PostgreSQL running on host machine via host.docker.internal
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
    # Enable host.docker.internal on Linux (already works on Windows/Mac)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        # Sync source files for hot reload
        - action: sync
          path: ./src
          target: /app/src
        # Sync public assets
        - action: sync
          path: ./public
          target: /app/public
        # Rebuild on package.json changes
        - action: rebuild
          path: ./package.json
        # Rebuild on config changes
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./tailwind.config.ts
        - action: rebuild
          path: ./tsconfig.json

volumes:
  db-data:
