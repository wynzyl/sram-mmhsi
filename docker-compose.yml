services:
  # Next.js Application (development)
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      # Connect to host machine's PostgreSQL via host.docker.internal
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-722811}@host.docker.internal:5432/${POSTGRES_DB:-SRAMS_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        # Sync source files for hot reload
        - action: sync
          path: ./src
          target: /app/src
        # Sync public assets
        - action: sync
          path: ./public
          target: /app/public
        # Rebuild on package.json changes
        - action: rebuild
          path: ./package.json
        # Rebuild on config changes
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./tailwind.config.ts
        - action: rebuild
          path: ./tsconfig.json
