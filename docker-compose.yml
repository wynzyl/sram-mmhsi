services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
    #   POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
    ports:
      # Exposed on host port 5434 so host-side tools (drizzle-kit, seed scripts) keep working
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    containername: SRAMS_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Next.js Application (development)
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Inside the compose network, reach Postgres via the service name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Sync source files for hot reload
        - action: sync
          path: ./src
          target: /app/src
        # Sync public assets
        - action: sync
          path: ./public
          target: /app/public
        # Rebuild on package.json changes
        - action: rebuild
          path: ./package.json
        # Rebuild on config changes
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./tailwind.config.ts
        - action: rebuild
          path: ./tsconfig.json

volumes:
  db-data:
