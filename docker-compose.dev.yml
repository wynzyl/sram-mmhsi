# Development Docker Compose override with hot reload
# Usage: docker compose -f compose.yaml -f docker-compose.dev.yml up --build

services:
  # Override migrate to use dev dockerfile
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    profiles:
      - tools

  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed-config"]
    profiles:
      - tools

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:722811@db:5432/SRAMS_DB
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret-key-change-in-production}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 722811
      POSTGRES_DB: SRAMS_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SRAMS_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
