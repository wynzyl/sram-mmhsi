# ─────────────────────────────────────────────────────────────────────────────
# SRAMS nginx Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# PRODUCTION NOTE (2026-08-19):
# This file is NOT used in the current production deployment.
#
# Production architecture uses:
#   Internet → Cloudflare → Nginx Proxy Manager (NPM) → app:3000
#
# NPM handles:
#   - SSL termination (Let's Encrypt)
#   - Reverse proxy to app container
#   - Security headers (configured in NPM admin UI)
#
# This nginx.conf is retained for:
#   - Local Docker development (docker-compose.yml)
#   - Alternative deployment scenarios without NPM
#   - Reference for nginx configuration patterns
#
# For production security headers, configure in NPM → Proxy Host → Advanced tab.
# See docs/SECURITY-REMEDIATION-PLAN.md for recommended headers.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Send "Connection: upgrade" only for upgrade requests (WebSocket),
    # otherwise "" to preserve upstream keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    types {
        image/webp webp;
    }

    # Gzip compression for faster responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;
    gzip_comp_level 6;

    # Aligned with Next.js bodySizeLimit (3MB)
    client_max_body_size 3M;

    upstream srams_upstream {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve uploaded student photos directly from the volume
        location /uploads/ {
            alias /app/public/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            proxy_pass http://srams_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Stream responses to browser for RSC/Suspense
            proxy_buffering off;
            proxy_request_buffering off;

            # Timeouts for slow uploads and report generation
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
