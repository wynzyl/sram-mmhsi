events {
    # Determines how many concurrent connections each worker process can handle
    worker_connections 1024;
}

http {
    # Defines the upstream server (your Node.js app)
    upstream srams_upstream {
        # 'app' is the service name defined in your docker-compose file.
        # Docker's internal DNS will automatically resolve this name.
        # Note: Change '3000' if your Node app uses a different internal port.
        server app:3000;
    }

    server {
        # Listen on port 80 (inside the container), which your docker-compose maps to host port 80
        listen 80;
        
        # You can change this to your LAN IP or local domain if you have one setup in your hosts file
        server_name localhost;

        location / {
            # Forward all requests to the upstream defined above
            proxy_pass http://srams_upstream;
            
            # Standard proxy headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Required if your app uses WebSockets, e.g., Next.js/React)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;

            # Stream responses to the browser as Next.js produces them.
            # Without this, nginx buffers the whole RSC/Suspense response,
            # so loading.tsx skeletons and streamed chunks never appear and
            # navigations look hung until the full page is ready.
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}