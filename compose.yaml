# Production Docker Compose configuration for SRAMS
# Usage: docker compose up --build -d

services:
  # Database migrations - run with: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build  # Use build stage which has all dependencies
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    profiles:
      - tools  # Only runs when explicitly called

  # Database seeding - run with: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://postgres:722811@db:5432/SRAMS_DB
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]
    profiles:
      - tools

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:722811@db:5432/SRAMS_DB
      - AUTH_SECRET=${AUTH_SECRET:-change-this-secret-in-production}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 722811
      POSTGRES_DB: SRAMS_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SRAMS_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
