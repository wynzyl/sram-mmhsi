# Production Docker Compose for SRAMS
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

networks:
  srams-network:
    driver: bridge

services:
  srams_db:
    image: postgres:15-alpine
    container_name: srams_db
    restart: always
    env_file:
      - .env.production
    environment:
      # ${VAR:-default} — compose interpolation reads the SHELL env / .env file,
      # NOT service env_file, so defaults are required for standalone `up`.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # NOTE: must match the database that already exists in the data directory
      # (the cluster was initialized with POSTGRES_DB=SRAMS_DB — names are
      # case-sensitive, and POSTGRES_DB is ignored once the data dir exists).
      POSTGRES_DB: ${POSTGRES_DB:-SRAMS_DB}
    volumes:
      # Host bind mount — data lives in ./.postgres_data (git-ignored).
      # The old named volume sram-mmhsi_db-data is kept untouched as backup.
      - ./.postgres_data:/var/lib/postgresql/data
    networks:
      - srams-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: sram-mmhsi-app:runner
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@srams_db:5432/${POSTGRES_DB:-SRAMS_DB}
    depends_on:
      srams_db:
        condition: service_healthy
    command: ["npx", "tsx", "scripts/migrate.ts"]
    restart: "no"
    networks:
      - srams-network  

  app:
    image: sram-mmhsi-app:runner
    build:
      context: .
      target: runner # Ensure your Dockerfile has a 'runner' stage
    container_name: srams_app
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@srams_db:5432/${POSTGRES_DB:-SRAMS_DB}
    depends_on:
      srams_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - srams-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80" # Exposed to Host ONLY for local LAN computers (via hosts file)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - srams-network
