# Production Docker Compose for SRAMS (run on the Ubuntu server)
# All container env comes from `env_file: .env.production` (this project keeps
# only .env.local / .env.production — no root .env). Avoid ${VAR} interpolation
# in this file: it reads the shell / a root .env, NOT service env_file, and
# silently resolves to "" without an --env-file flag.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm migrate npm run db:seed
#
# `name:` below pins the compose project, so no -p flag is needed and re-running
# from any shell can't collide with the fixed container_names. The value matches
# the Ubuntu server's repo directory name, so the server's existing project and
# its data volume (sram-mmhsi_db-data) carry over with zero migration steps.
# NEVER pass -p — it overrides this pin and recreates the name conflicts.
# (Local dev uses docker-compose.yml under project "srams-dev" — see that file.)

name: sram-mmhsi

networks:
  srams-network:
    driver: bridge

services:
  srams_db:
    image: postgres:15-alpine
    container_name: srams_db
    restart: always
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env.production.
    # NOTE: POSTGRES_DB must match the database that already exists in the data
    # volume (the cluster was initialized with SRAMS_DB — names are
    # case-sensitive, and POSTGRES_DB is ignored once the data dir exists).
    env_file:
      - .env.production
    # ports:
    #   # Expose on 5433 (Production) — 5432 is taken by a native host Postgres
    #   # and 5434 by the dev stack's db, so prod can run side-by-side with both.
    #   - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - srams-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: sram-mmhsi-app:runner
    # Image is built locally by the `app` service — never try to pull it from a
    # registry (a parallel pull races the first `up --build` and fails the stack).
    pull_policy: never
    # DATABASE_URL comes from .env.production and must use the INTERNAL port
    # (srams_db:5432) — the 5433 mapping only exists on the host side of "5433:5432".
    env_file:
      - .env.production
    depends_on:
      srams_db:
        condition: service_healthy
    command: ["npx", "tsx", "scripts/migrate.ts"]
    restart: "no"
    networks:
      - srams-network

  app:
    image: sram-mmhsi-app:runner
    build:
      context: .
      target: runner # Ensure your Dockerfile has a 'runner' stage
    container_name: srams_app
    restart: always
    # DATABASE_URL comes from .env.production (internal port — see migrate note).
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # This deployment is plain HTTP on the LAN (no TLS at nginx) — browsers drop
      # `Secure` cookies on http:// origins, which breaks login from other machines.
      # Default false HERE so the setting travels via git: the .env.production
      # override is gitignored and never reaches the server on pull. Flip via
      # shell env / --env-file once HTTPS is added at nginx.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      srams_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - srams-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80" # Exposed to Host ONLY for local LAN computers (via hosts file)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - srams-network

  metabase:
    image: metabase/metabase:latest
    restart: always
    ports:
      - "3005:3000" # Exposes Metabase on port 3005 of your Ubuntu host
    env_file:
      - .env.production
    depends_on:
      srams_db:
        condition: service_healthy
    networks:
      - srams-network

volumes:
  db-data:
