# Production Docker Compose for SRAMS (run on the Ubuntu server)
# All container env comes from `env_file: .env.production` (this project keeps
# only .env.local / .env.production — no root .env). Avoid ${VAR} interpolation
# in this file: it reads the shell / a root .env, NOT service env_file, and
# silently resolves to "" without an --env-file flag.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

networks:
  srams-network:
    driver: bridge

services:
  srams_db:
    image: postgres:15-alpine
    container_name: srams_db
    restart: always
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env.production.
    # NOTE: POSTGRES_DB must match the database that already exists in the data
    # volume (the cluster was initialized with SRAMS_DB — names are
    # case-sensitive, and POSTGRES_DB is ignored once the data dir exists).
    env_file:
      - .env.production
    ports:
      # Expose on 5434 (Production) to avoid clashing with a local Postgres on 5432
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - srams-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: sram-mmhsi-app:runner
    # DATABASE_URL comes from .env.production and must use the INTERNAL port
    # (srams_db:5432) — the 5434 mapping only exists on the host side of "5434:5432".
    env_file:
      - .env.production
    depends_on:
      srams_db:
        condition: service_healthy
    command: ["npx", "tsx", "scripts/migrate.ts"]
    restart: "no"
    networks:
      - srams-network

  app:
    image: sram-mmhsi-app:runner
    build:
      context: .
      target: runner # Ensure your Dockerfile has a 'runner' stage
    container_name: srams_app
    restart: always
    # DATABASE_URL comes from .env.production (internal port — see migrate note).
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # This deployment is plain HTTP on the LAN (no TLS at nginx) — browsers drop
      # `Secure` cookies on http:// origins, which breaks login from other machines.
      # Default false HERE so the setting travels via git: the .env.production
      # override is gitignored and never reaches the server on pull. Flip via
      # shell env / --env-file once HTTPS is added at nginx.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      srams_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - srams-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80" # Exposed to Host ONLY for local LAN computers (via hosts file)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - srams-network

volumes:
  db-data:
