name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # TODO: drop continue-on-error once the ~45 pre-existing ESLint errors are
    # cleaned up — until then lint is informational so CI stays meaningful.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Dummy env vars for build (not real secrets)
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/srams_ci
          AUTH_SECRET: "lP9XyESSY9lT1FHTy3HifckKg/5rRLPuys2y/BOneQk="
          APP_BASE_URL: http://localhost:3000

  migration-check:
    name: Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted schema changes
        run: |
          npm run db:generate -- --name ci-check 2>/dev/null || true
          # Check if any new migration files were generated
          if git diff --exit-code drizzle/; then
            echo "✅ Schema is in sync with migrations"
          else
            echo "❌ Schema changes detected without corresponding migration"
            echo "Run 'npm run db:generate' locally and commit the migration"
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/srams_ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srams_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/srams_e2e
      AUTH_SECRET: "fAKeSeCRET9lT1FHTy3HifckKg/5rRLPuys2y/BOneQk="
      APP_BASE_URL: http://127.0.0.1:3005
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed system configuration (school years, grade levels, fee types)
        run: npm run db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite provisions its own users, students, fee schedule, and OR
      # booklet via e2e/global-setup.ts — no further seeding required.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
